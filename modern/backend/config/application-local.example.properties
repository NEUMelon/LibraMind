# Copy to application-local.properties. The private copy must not be committed.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/libramind?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=libramind_dev
spring.datasource.password=REPLACE_LOCALLY
# Only used to create the first administrator. Existing accounts are never reset.
app.bootstrap.username=admin
app.bootstrap.password=REPLACE_WITH_A_RANDOM_PASSWORD
# No API key is required for ordinary CRUD. Live AI reads this external UTF-8 file.
# Java .properties paths containing non-ASCII characters should use Unicode escapes.
app.ai.key-file=
app.ai.mode=offline
app.ai.daily-budget-usd=0.50
app.ai.index-worker-enabled=false
app.ai.record-replay=false
app.circulation.max-active=5
app.circulation.loan-days=30
app.circulation.max-renewals=1
app.circulation.renewal-days=30
app.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
