server:
  address: ${LIBRAMIND_BIND_ADDRESS:127.0.0.1}
  port: ${LIBRAMIND_PORT:8090}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: libramind-backend
  config:
    import: optional:file:./config/application-local.properties
  datasource:
    url: ${LIBRAMIND_DB_URL:jdbc:mysql://127.0.0.1:3306/libramind?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=5000&socketTimeout=10000}
    username: ${LIBRAMIND_DB_USERNAME:libramind_dev}
    password: ${LIBRAMIND_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: false
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  bootstrap:
    username: ${LIBRAMIND_ADMIN_USERNAME:admin}
    password: ${LIBRAMIND_ADMIN_PASSWORD:}
  ai:
    base-url: https://aihubmix.com
    api-key: ${AIHUBMIX_API_KEY:}
